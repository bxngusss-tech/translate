<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate</title>
    <style>
        /* Remove default browser spacing and hide unexpected scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Optional: smooth backdrop while loading */
        }

        /* Force the iframe to fill the viewport layout */
        iframe {
            display: block; /* Removes inline layout gaps */
            width: 100vw;   /* 100% of the viewport width */
            height: 100vh;  /* 100% of the viewport height */
            border: none;   /* Removes default frame borders */
        }
    </style>
</head>
<body>

    <!-- Embedded website. Replace src with your target URL -->
    <iframe 
        src="https://cdn.jsdelivr.net/gh/omaristhefunny/desynctutorsyou@happiness/index.svg" 
        allow="fullscreen *"
        sandbox="allow-scripts allow-same-origin allow-forms">
    </iframe>

</body>
</html>
