<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Fishing - pages.dev chronicles</title>
   <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #09090b;
      color: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .top-bar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      background-color: #141417;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid #27272a;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      background-color: #1f1f23;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      padding: 9px 16px;
      border-radius: 7px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
    }

    .btn:hover {
      background-color: #ffffff;
      color: #09090b;
      border-color: #ffffff;
    }

    .iframe-wrapper {
      width: 100%;
      max-width: 1100px;
      height: 76vh;
      background-color: #000000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #27272a;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="btn">← Back</a>
    <div class="controls">
      <button class="btn" onclick="openAboutBlank()">Open in about:blank</button>
      <button class="btn" onclick="goFullscreen()">Fullscreen</button>
    </div>
  </div>

  <div class="iframe-wrapper">
    <iframe id="game-frame" src="" allowfullscreen></iframe>
  </div>

  <script>
    // PASTE YOUR GAME LINK HERE
    const gameUrl = "https://tiny-fishing.pages.dev/";

    // Automatically loads the URL into the iframe
    const iframe = document.getElementById("game-frame");
    iframe.src = gameUrl;

    // Fullscreen function
    function goFullscreen() {
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
      }
    }

    // Open in about:blank tab function
    function openAboutBlank() {
      const win = window.open("about:blank", "_blank");
      if (!win) {
        alert("Pop-up blocked! Please allow pop-ups for this site.");
        return;
      }
      win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>New Tab</title>
          <style>
            body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
            iframe { width: 100%; height: 100%; border: none; }
          </style>
        </head>
        <body>
          <iframe src="${gameUrl}" allowfullscreen></iframe>
        </body>
        </html>
      `);
      win.document.close();
    }
  </script>

</body>
</html>
