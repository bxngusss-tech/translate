<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Game</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #1e1e2e;
      color: #cdd6f4;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 40px);
      text-align: center;
    }
    .score-box {
      font-size: 48px;
      font-weight: bold;
      margin: 20px 0;
      color: #a6e3a1;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.96);
    }
    .btn-score {
      background-color: #89b4fa;
      color: #11111b;
    }
    .btn-reset {
      background-color: #f38ba8;
      color: #11111b;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #a6adc8;
    }
  </style>
</head>
<body>

  <h2>Test Clicker Game</h2>
  <p>Click the button to earn points. Refresh the page to verify your progress saves!</p>

  <div class="score-box" id="scoreDisplay">0</div>

  <div>
    <button class="btn-score" onclick="addPoint()">+1 Point</button>
    <button class="btn-reset" onclick="resetScore()">Reset Save</button>
  </div>

  <div class="status" id="statusMessage">Checking storage...</div>

  <script>
    const SAVE_KEY = "my_test_game_score";
    let score = 0;

    // Load saved progress when the game starts
    function loadProgress() {
      try {
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved !== null) {
          score = parseInt(saved, 10);
          updateStatus("Save data loaded successfully!");
        } else {
          updateStatus("No previous save found. Starting at 0.");
        }
      } catch (e) {
        updateStatus("Error: Browser blocked storage access inside iframe.");
      }
      updateDisplay();
    }

    // Add a point and save immediately
    function addPoint() {
      score++;
      updateDisplay();
      saveProgress();
    }

    // Save current score to localStorage
    function saveProgress() {
      try {
        localStorage.setItem(SAVE_KEY, score);
        updateStatus("Progress saved!");
      } catch (e) {
        updateStatus("Failed to save progress.");
      }
    }

    // Reset the saved score
    function resetScore() {
      score = 0;
      localStorage.removeItem(SAVE_KEY);
      updateDisplay();
      updateStatus("Save data cleared.");
    }

    function updateDisplay() {
      document.getElementById("scoreDisplay").innerText = score;
    }

    function updateStatus(msg) {
      document.getElementById("statusMessage").innerText = msg;
    }

    // Initialize game
    loadProgress();
  </script>

</body>
</html>
