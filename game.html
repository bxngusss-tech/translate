<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }
    .top-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      box-sizing: border-box;
    }
    a.back-btn, button.fs-btn {
      background-color: #313244;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    a.back-btn:hover, button.fs-btn:hover {
      background-color: #45475a;
    }
    iframe {
      width: 900px;
      height: 600px;
      max-width: 95vw;
      max-height: 80vh;
      border: 3px solid #333;
      border-radius: 8px;
      background-color: #000;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">← Back to Games</a>
    <span><strong>Clicker Game</strong></span>
    <button class="fs-btn" onclick="goFullscreen()">Fullscreen ⛶</button>
  </div>

  <!-- The iframe loads the actual game and grants storage permissions -->
  <iframe 
    id="gameFrame"
    src="" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-storage-access-by-user-activation"
    allowfullscreen>
  </iframe>

  <script>
    function goFullscreen() {
      const iframe = document.getElementById("gameFrame");
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      }
    }
  </script>

</body>
</html>
