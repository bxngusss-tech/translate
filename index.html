<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pages.dev chronicles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #09090b;
      background-image: radial-gradient(circle at top, #18181b 0%, #09090b 65%);
      color: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 60px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
      padding-bottom: 18px;
      border-bottom: 1px solid #27272a;
      width: 100%;
      max-width: 1000px;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-transform: lowercase;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 1000px;
    }

    .game-btn {
      background-color: #141417;
      color: #e4e4e7;
      text-decoration: none;
      border: 1px solid #27272a;
      border-radius: 10px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.2px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      padding: 12px;
    }

    .game-btn:hover {
      background-color: #1f1f23;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.75);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    .game-btn:active {
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <header>
    <h1>pages.dev chronicles</h1>
  </header>

  <main class="grid-container">
    <a href="drivemad.html" class="game-btn">Drive Mad</a>
    <a href="snowrider.html" class="game-btn">Snow Rider</a>
    <a href="angrybirds.html" class="game-btn">Angry Birds</a>
    <a href="basketrandom.html" class="game-btn">Basket Random</a>
    <a href="crossyroad.html" class="game-btn">Crossy Road</a>
    <a href="stickmanhook.html" class="game-btn">Stickman Hook</a>
    <a href="tinyfishing.html" class="game-btn">Tiny Fishing</a>
    <a href="coreball.html" class="game-btn">Coreball</a>
    
    <!-- Extra Slots -->
    <a href="retrobowl.html" class="game-btn">Retro Bowl</a>
    <a href="clusterrush.html" class="game-btn">Cluster Rush</a>
    <a href="game11.html" class="game-btn"></a>
    <a href="game12.html" class="game-btn"></a>
  </main>

</body>
</html>
