<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pages.dev chronicles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 1px;
      color: #38bdf8;
      text-transform: lowercase;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .game-btn {
      background-color: #1e293b;
      color: #f8fafc;
      text-decoration: none;
      border: 2px solid #334155;
      border-radius: 12px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
      padding: 10px;
    }

    .game-btn:hover {
      background-color: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>pages.dev chronicles</h1>
  </header>

  <main class="grid-container">
    <a href="drivemad.html" class="game-btn">Drive Mad</a>
    <a href="snowrider.html" class="game-btn">Snow Rider</a>
    <a href="angrybirds.html" class="game-btn">Angry Birds</a>
    <a href="basketrandom.html" class="game-btn">Basket Random</a>
    <a href="crossyroad.html" class="game-btn">Crossy Road</a>
    <a href="stickmanhook.html" class="game-btn">Stickman Hook</a>
    <a href="tinyfishing.html" class="game-btn">Tiny Fishing</a>
    <a href="coreball.html" class="game-btn">Coreball</a>
    
    <!-- 4 Blank Buttons -->
    <a href="retrobowl.html" class="game-btn">Retro Bowl</a>
    <a href="clusterrush.html" class="game-btn">Cluster Rush</a>
    <a href="game11.html" class="game-btn"></a>
    <a href="game12.html" class="game-btn"></a>
  </main>

</body>
</html>
