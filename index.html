<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unblocked Games Hub</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    h1 {
      margin-bottom: 15px;
      font-size: 24px;
    }
    iframe {
      width: 800px;
      height: 500px;
      max-width: 95vw;
      max-height: 80vh;
      border: 3px solid #333;
      border-radius: 8px;
      background-color: #000;
    }
  </style>
</head>
<body>

  <h1>My Unblocked Game</h1>

  <!-- The sandbox attributes below allow scripts and same-origin storage to work -->
  <iframe 
    src="game.html" 
    sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-storage-access-by-user-activation"
    allowfullscreen>
  </iframe>

</body>
</html>
