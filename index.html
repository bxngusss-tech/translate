<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unblocked Games Hub</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .game-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .game-card {
      background-color: #1e1e2e;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 20px;
      width: 200px;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s, border-color 0.2s;
    }
    .game-card:hover {
      transform: translateY(-5px);
      border-color: #89b4fa;
    }
    .game-card h3 {
      margin: 0 0 10px 0;
      color: #89b4fa;
    }
  </style>
</head>
<body>

  <h1>Unblocked Games Hub</h1>
  <p>Select a game below to play:</p>

  <div class="game-grid">
    <!-- Links to your game wrapper page -->
    <a href="game.html" class="game-card">
      <h3>Clicker Game</h3>
      <p>Click to play and save your high score!</p>
    </a>
  </div>

</body>
</html>
